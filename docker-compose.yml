x-api-backend: &api-backend
  build:
    context: .
    dockerfile: dockerfile
  expose:
    - "5000"
  labels:
    - "com.docker.compose.project=sre-cupones"
    - "role=api-backend"
    - "autoheal=true"
  healthcheck:
    test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")' || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  deploy:
    resources:
      limits:
        cpus: "0.15"
        memory: 128M
  restart: unless-stopped

services:
  api-backend-1:
    <<: *api-backend
    container_name: api-backend-1
    environment:
      - INSTANCE_ID=api-backend-1

  api-backend-2:
    <<: *api-backend
    container_name: api-backend-2
    environment:
      - INSTANCE_ID=api-backend-2

  api-backend-3:
    <<: *api-backend
    container_name: api-backend-3
    environment:
      - INSTANCE_ID=api-backend-3

  api-backend-4:
    <<: *api-backend
    container_name: api-backend-4
    environment:
      - INSTANCE_ID=api-backend-4

  nginx-balanceador:
    image: nginx:1.27-alpine
    container_name: nginx-balanceador
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-backend-1:
        condition: service_healthy
      api-backend-2:
        condition: service_healthy
      api-backend-3:
        condition: service_healthy
      api-backend-4:
        condition: service_healthy

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=5
      - AUTOHEAL_START_PERIOD=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  locust:
    image: locustio/locust:latest
    container_name: locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./evidence:/mnt/evidence
    command: -f /mnt/locust/locustfile.py --host http://nginx-balanceador --autostart -u 30 -r 5
    depends_on:
      - nginx-balanceador
