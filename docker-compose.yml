services:
  api-backend-1:
    build:
      context: .
      dockerfile: dockerfile
    container_name: api-backend-1
    environment:
      - INSTANCE_ID=api-backend-1
    expose:
      - "5000"
    labels:
      - "com.docker.compose.project=sre-compras"
      - "role=api-backend"

  api-backend-2:
    build:
      context: .
      dockerfile: dockerfile
    container_name: api-backend-2
    environment:
      - INSTANCE_ID=api-backend-2
    expose:
      - "5000"
    labels:
      - "com.docker.compose.project=sre-compras"
      - "role=api-backend"

  nginx-balanceador:
    image: nginx:1.27-alpine
    container_name: nginx-balanceador
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend-1
      - api-backend-2

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  locust:
    image: locustio/locust:latest
    container_name: locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
      - ./evidence:/mnt/evidence
    command: -f /mnt/locust/locustfile.py --host http://nginx-balanceador
    depends_on:
      - nginx-balanceador
